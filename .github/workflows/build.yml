name: Build MatrixMod PKG
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make texinfo libncurses5-dev patch python-is-python3 subversion wget zlib1g-dev libtool libtool-bin python3-dev bzip2 libgmp3-dev pkg-config g++ libssl-dev git unzip
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER /usr/local/ps3dev
      - name: Build PS3 toolchain
        run: |
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
      - name: Build PKG
        run: |
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          unzip -q MatrixMod-PS3.zip
          cd MatrixMod-PS3
          make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: MatrixMod-pkg
          path: MatrixMod-PS3/*.pkg
